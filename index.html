<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>타임블럭 플래너 (08:00–19:00, 5분 단위)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="title">타임블럭 플래너</div>
    <div class="subtitle">08:00–19:00 · 5분 단위</div>
  </header>

  <main class="app">
    <section class="calendar">
      <div class="calendar-head">
        <div class="head-label">시간</div>
        <div class="head-main">일정</div>
      </div>
      <div class="calendar-body">
        <div id="time-labels" class="time-labels"></div>
        <div id="grid" class="grid" aria-label="타임블럭 그리드" role="group">
        </div>
      </div>
    </section>
  </main>

  <section class="log">
    <div class="log-head">
      <div class="log-title">실시간 기록</div>
      <div class="log-actions">
        <button id="resetBtn" class="ghost" type="button" disabled>전체 초기화</button>
        <button id="copyBtn" class="copy" type="button" disabled>전체 복사</button>
      </div>
    </div>
    <div id="logList" class="log-list"></div>
    <div id="statusRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </section>

  <footer class="footer">
    일정은 이 브라우저에 자동 저장됩니다.
  </footer>

  <!-- 팝업: grid 바깥으로 이동 (overflow:hidden 회피) -->
  <div id="popover-backdrop" class="popover-backdrop hidden"></div>
  <div id="popover" class="popover hidden" role="dialog" aria-modal="true" aria-labelledby="popover-title">
    <div id="popover-title" class="popover-title">일정 편집</div>
    <div class="popover-field">
      <label for="titleInput">업무명</label>
      <input id="titleInput" type="text" placeholder="예: 기획서 작성" />
    </div>
    <div class="popover-field">
      <label for="purposeInput">일의 목적</label>
      <input id="purposeInput" type="text" placeholder="예: 초안 완성" />
    </div>
    <div class="time-readout">
      <div>시작시간: <span id="startReadout">-</span></div>
      <div>종료시간: <span id="endReadout">-</span></div>
    </div>
    <div class="popover-actions">
      <button id="deleteBtn" class="danger" disabled>삭제</button>
      <button id="closeBtn" class="ghost">닫기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
